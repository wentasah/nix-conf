# CI pipeline for nix-conf, run locally on the CI host by opal:
#
#   opal run --no-tui --max-parallel-jobs 4
#
# First, nixpkgs-update updates my nixpkgs fork (wentasah/master) by
# `nix-conf merge` of my topic branches onto new nixos-unstable.
# Then two independent chains run:
#   - update stable inputs   -> build stable hosts   -> push to origin/stable
#   - update unstable inputs -> build unstable hosts -> push to origin/unstable
#     (only if my nixpkgs fork or main changed, or to retry after a
#     failure of one of the last two unstable chains)
# Pushing happens only if all builds in the chain succeed.
#
# See bin/nix-ci for the implementation of the individual steps. Jobs
# run in docker containers using the host's Nix store and daemon (see
# .opal/config.toml and .opal/bootstrap.sh).

stages:
  - nixpkgs
  - update
  - build
  - push

default:
  image: docker.io/library/alpine:3.20  # only provides /bin/sh; tools come from /nix

variables:
  ATTIC_CACHE: wsh  # leave empty to not push build results to attic

.update:
  stage: update
  script:
    - bin/nix-ci update "$BRANCH"
  artifacts:
    paths:
      - ci-update/
    reports:
      dotenv: ci-update/ci.env

# The CHECK lists in build-stable and build-unstable together should
# cover `checks` in flake.nix.
.build:
  stage: build
  script:
    - bin/nix-ci build "$CHECK"
  artifacts:
    paths:
      - ci-build/  # CHECK.out, CHECK.diff (merged from all build jobs for push)

.push:
  stage: push
  script:
    - bin/nix-ci push "$BRANCH"

# Update my nixpkgs fork (works in ~/nix/nixpkgs on the CI host)
nixpkgs-update:
  stage: nixpkgs
  script:
    - bin/nix-ci nixpkgs-update
  artifacts:
    paths:
      - ci-nixpkgs/
    reports:
      dotenv: ci-nixpkgs/ci.env  # NIX_CI_NIXPKGS_UPDATED for update-unstable

# Stable chain

update-stable:
  extends: .update
  needs: []
  variables:
    BRANCH: stable

bld-st:
  extends: .build
  needs: [update-stable]
  parallel:
    matrix:
      - CHECK:
          - foxglove-src
          - lucka-ntb
          - mikysak
          - resox
          - homeassistant

push-stable:
  extends: .push
  needs: [update-stable, bld-st]
  variables:
    BRANCH: stable

# Unstable chain

update-unstable:
  extends: .update
  needs: [nixpkgs-update]  # nixpkgs input follows wentasah/master
  variables:
    BRANCH: unstable

bld-un:
  extends: .build
  needs: [update-unstable]
  parallel:
    matrix:
      - CHECK:
          - ritchie
          - steelpick
          - tvbox

push-unstable:
  extends: .push
  needs: [update-unstable, bld-un]
  variables:
    BRANCH: unstable
